name: release fpk

on:
  push:
    tags:
      - '*'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  NODE_VERSION: "18"
  PYTHON_VERSION: '3.11'

jobs:  
  # 主 job，负责设置变量
  setup:
    runs-on: ubuntu-latest
    outputs:
      # tag: ${{ steps.set-tag.outputs.tag }}
      prerelease: ${{ steps.set-tag.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set tag and prerelease info
        id: set-tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF##*/}"
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            OpenListVersion=$(curl -s "https://api.github.com/repos/OpenListTeam/OpenList/releases/latest" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/' | sed 's/^v//' 2>/dev/null | grep . || echo "unknown")
            echo "OpenList最新版本: $OpenListVersion"
            TAG="${OpenListVersion}"
          else
            TAG="build-${GITHUB_RUN_NUMBER}"
          fi
          
          if [[ "$TAG" == build-* ]] || [[ "${TAG}" == *dev* ]] || [[ "${TAG}" == *pre* ]] || [[ "${TAG}" == *beta* ]]; then
            PRE=true
          else
            PRE=false
          fi
          
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "prerelease=$PRE" >> $GITHUB_OUTPUT

  build-multi-arch:
    needs: setup
    outputs:
      release_version: ${{ steps.release-version.outputs.version }}
    strategy:
      matrix:
        include:
          - arch: x86
            runner: ubuntu-latest
          - arch: arm
            runner: ubuntu-latest
          - arch: risc-v
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run build
        run: |
          echo "开始构建架构: ${{ matrix.arch }}"
          chmod +x ./fnpack.sh 2>/dev/null || true
          chmod +x ./build.sh 2>/dev/null || true
          ./build.sh arch=${{ matrix.arch }} build_pre="${{ needs.setup.outputs.prerelease }}" build_all="true" download_proxy_url="" 2>/dev/null || true

      - name: Prepare artifact
        run: |
          FPK_FILE=$(ls *.fpk 2>/dev/null | head -1)
          if [ -z "$FPK_FILE" ]; then
            echo "错误：未找到.fpk文件"
            ls -la
            exit 1
          fi
          
          mkdir -p release
          cp "$FPK_FILE" "release/$FPK_FILE"
          echo "准备完成: $FPK_FILE"
          # if [ "${{ needs.setup.outputs.prerelease }}" == "true" ]; then
          #   cp "$FPK_FILE" "release/$FPK_FILE"
          #   echo "准备完成: $FPK_FILE"
          # else
          #   # 正式版去除版本号
          #   NEW_FPK_NAME="OpenList-${{ matrix.arch }}.fpk"
          #   cp "$FPK_FILE" "release/$NEW_FPK_NAME"
          #   echo "准备完成: $NEW_FPK_NAME"
          # fi

      - name: Get release version
        id: release-version
        run: |
          FPK_FILE=$(ls *.fpk 2>/dev/null | head -1)
          if [ -z "$FPK_FILE" ]; then
            echo "错误：未找到.fpk文件"
            ls -la
            echo "version='0-error'" >> $GITHUB_OUTPUT
            exit 1
          fi
          # 读取版本号
          version=$(sed -n 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*//p' ./OpenList/manifest | sed 's/^"\|"$//g')
          echo "构建FPK版本: $version"
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fpk-${{ matrix.arch }}
          path: release/
          retention-days: 1

  create-release:
    needs: 
      - setup
      - build-multi-arch
    runs-on: ubuntu-latest
    steps:
      - name: Create release directory
        run: |
          mkdir -p combined-release
    
      - name: Download amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: fpk-x86
          path: combined-release

      - name: Download arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: fpk-arm
          path: combined-release

      - name: Download riscv64 artifact
        uses: actions/download-artifact@v4
        with:
          name: fpk-risc-v
          path: combined-release

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          name: ${{ needs.build-multi-arch.outputs.release_version }}
          tag: "release/${{ needs.build-multi-arch.outputs.release_version }}"
          artifacts: "combined-release/*"
          prerelease: ${{ needs.setup.outputs.prerelease }}
          skipIfReleaseExists: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release summary
        if: always()
        run: |
          echo "=== 发布总结 ==="
          echo "代码分支/标签: release/${{ needs.build-multi-arch.outputs.release_version }}"
          echo "版本:  ${{ needs.build-multi-arch.outputs.release_version }}"
          echo "预发布: ${{ needs.setup.outputs.prerelease }}"
          echo "包含的文件:"
          ls -la combined-release/
          echo "================"